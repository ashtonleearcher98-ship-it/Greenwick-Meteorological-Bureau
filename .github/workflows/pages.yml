name: Refresh Greenwick forecast cache
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate the next 200 days
        run: python3 scripts/generate_forecasts.py
      - name: Save the updated cache to the Pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecasts-200.json
          if git diff --cached --quiet; then
            echo "Forecast cache is already current."
          else
            git commit -m "Refresh 200-day Greenwick forecast cache"
            git push origin HEAD:main
          fi
